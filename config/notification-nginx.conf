worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # No URI, query string, client identity, headers or body in access logs.
    log_format timing 'time=$time_iso8601 method=$request_method status=$status '
                      'total=$request_time connect=$upstream_connect_time '
                      'response=$upstream_response_time upstream_status=$upstream_status';
    access_log /dev/stdout timing;
    upstream official_notifications {
        include /etc/chatmail-notify/upstream.inc;
        keepalive 8;
        keepalive_timeout 90s;
        keepalive_requests 1000;
    }
    server {
        listen 127.0.0.1:@@PORT@@;
        server_name localhost;
        client_max_body_size 64k;
        client_body_timeout 5s;
        keepalive_timeout 90s;
        allow 127.0.0.1;
        deny all;
        if ($args != "") { return 400; }
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }
        location = /notify {
            limit_except GET POST { deny all; }
            proxy_pass https://official_notifications;
            proxy_http_version 1.1;
            proxy_set_header Host notifications.delta.chat;
            proxy_set_header Connection "";
            proxy_pass_request_headers off;
            proxy_set_header Content-Type application/octet-stream;
            proxy_set_header Content-Length $content_length;
            proxy_ssl_session_reuse on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 5;
            proxy_ssl_name notifications.delta.chat;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_server_name @@SNI@@;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_connect_timeout 4s;
            proxy_send_timeout 6s;
            proxy_read_timeout 8s;
            proxy_buffering off;
            # Never enable non_idempotent: the metadata queue owns POST retries.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
        location / { access_log off; return 404; }
    }
}
